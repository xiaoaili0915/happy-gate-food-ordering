<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Happy Gate{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#b91c1c',
                            600: '#991b1b',
                            700: '#7f1d1d',
                            800: '#651a1a',
                            900: '#450a0a',
                        }
                    }
                }
            }
        }
    </script>
    {% block head %}{% endblock %}
</head>
<body class="bg-stone-50 min-h-screen relative">
    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="/static/images/dragon-phoenix.png"
             alt="" class="w-full h-full object-cover opacity-[0.15]">
    </div>
    <header class="bg-brand-700 shadow-lg relative z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div id="lang-switcher" class="flex items-center gap-1">
                <button onclick="setLang('nl')" class="lang-btn px-1.5 py-0.5 rounded text-xs hover:bg-white/10" data-lang="nl" title="Nederlands">
                    <img src="https://flagcdn.com/w20/nl.png" width="16" height="12" alt="NL" class="inline">
                </button>
                <button onclick="setLang('en')" class="lang-btn px-1.5 py-0.5 rounded text-xs hover:bg-white/10" data-lang="en" title="English">
                    <img src="https://flagcdn.com/w20/gb.png" width="16" height="12" alt="EN" class="inline">
                </button>
                <button onclick="setLang('zh')" class="lang-btn px-1.5 py-0.5 rounded text-xs hover:bg-white/10" data-lang="zh" title="中文">
                    <img src="https://flagcdn.com/w20/cn.png" width="16" height="12" alt="中文" class="inline">
                </button>
            </div>
            <a href="/cart" class="relative text-white/80 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
                </svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-brand-900 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </a>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6 relative z-10">
        {% block content %}{% endblock %}
    </main>
    <script>

                'order.not_found': '订单未找到',
                'order.back_to_menu': '返回菜单',
            }
        };

        function getLang() {
            return localStorage.getItem('lang') || 'nl';
        }

        function t(key) {
            const lang = getLang();
            return translations[lang][key] || translations['nl'][key] || key;
        }

        function setLang(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            applyTranslations();
            highlightLangBtn();
            if (typeof onLangChange === 'function') onLangChange();
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        function highlightLangBtn() {
            const lang = getLang();
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.style.outline = '2px solid white';
                    btn.style.outlineOffset = '1px';
                    btn.style.opacity = '1';
                } else {
                    btn.style.outline = 'none';
                    btn.style.opacity = '0.6';
                }
            });
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-count');
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        document.documentElement.lang = getLang();
        highlightLangBtn();
        updateCartBadge();
        applyTranslations();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
