{% extends "base.html" %}
{% block title %}Checkout - Happy Gate{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6" data-i18n="checkout.title">Afrekenen</h1>

<form id="checkout-form" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="checkout.name">Naam *</label>
        <input type="text" id="customer_name" required
               class="w-full border rounded-lg px-4 py-3" data-i18n-placeholder="checkout.name_placeholder" placeholder="Uw naam">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="checkout.email">E-mail *</label>
        <input type="email" id="customer_email" required
               class="w-full border rounded-lg px-4 py-3" data-i18n-placeholder="checkout.email_placeholder" placeholder="u@voorbeeld.nl">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="checkout.phone">Telefoon *</label>
        <input type="tel" id="customer_phone" required
               class="w-full border rounded-lg px-4 py-3" data-i18n-placeholder="checkout.phone_placeholder" placeholder="06-12345678">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="checkout.pickup_notes">Ophaalnotities (optioneel)</label>
        <input type="text" id="pickup_notes"
               class="w-full border rounded-lg px-4 py-3" data-i18n-placeholder="checkout.pickup_placeholder" placeholder="bijv. Ik sta in een rode auto">
    </div>

    <div class="border-t pt-4 mt-6">
        <div id="checkout-summary" class="text-sm text-gray-600 mb-4"></div>
    </div>

    <button type="submit" id="submit-btn"
            class="w-full bg-gray-900 text-white py-4 rounded-lg font-medium text-lg hover:bg-gray-800" data-i18n="checkout.place_order">
        Bestelling plaatsen
    </button>
    <p id="error-msg" class="text-red-600 text-sm hidden"></p>
</form>
{% endblock %}

{% block scripts %}
<script>
const cart = JSON.parse(localStorage.getItem('cart') || '[]');

if (cart.length === 0) {
    window.location.href = '/cart';
}

// Show summary
const total = cart.reduce((sum, item) => {
    const modTotal = item.modifiers.reduce((s, m) => s + m.price_cents, 0);
    return sum + (item.unit_price_cents + modTotal) * item.quantity;
}, 0);
const itemCount = cart.reduce((s, i) => s + i.quantity, 0);
document.getElementById('checkout-summary').textContent =
    `${itemCount} item${itemCount > 1 ? 's' : ''} - €${(total/100).toFixed(2)}`;

document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errMsg = document.getElementById('error-msg');
    errMsg.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = t('checkout.placing');

    const payload = {
        customer_name: document.getElementById('customer_name').value.trim(),
        customer_email: document.getElementById('customer_email').value.trim(),
        customer_phone: document.getElementById('customer_phone').value.trim(),
        pickup_notes: document.getElementById('pickup_notes').value.trim(),
        items: cart,
    };

    try {
        const res = await fetch('/api/orders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.removeItem('cart');
            window.location.href = `/order/${data.order_id}`;
        } else {
            throw new Error(data.detail || 'Order failed');
        }
    } catch (err) {
        errMsg.textContent = err.message || t('checkout.error');
        errMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = t('checkout.place_order');
    }
});
</script>
{% endblock %}
