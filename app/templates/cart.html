{% extends "base.html" %}
{% block title %}Cart - Happy Gate{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6" data-i18n="cart.title">Uw Winkelwagen</h1>

<div id="cart-empty" class="hidden text-center py-12">
    <p class="text-gray-500 text-lg" data-i18n="cart.empty">Uw winkelwagen is leeg</p>
    <a href="/" class="inline-block mt-4 text-blue-600 hover:underline" data-i18n="cart.browse">Bekijk menu</a>
</div>

<div id="cart-items" class="space-y-4"></div>

<div id="cart-footer" class="hidden mt-8 border-t pt-6">
    <div class="flex justify-between items-center text-xl font-bold mb-6">
        <span data-i18n="cart.total">Totaal</span>
        <span id="cart-total">€0.00</span>
    </div>
    <a href="/checkout" class="block w-full bg-gray-900 text-white text-center py-4 rounded-lg font-medium text-lg hover:bg-gray-800" data-i18n="cart.checkout">
        Afrekenen
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cart-items');
    const emptyMsg = document.getElementById('cart-empty');
    const footer = document.getElementById('cart-footer');

    if (cart.length === 0) {
        emptyMsg.classList.remove('hidden');
        footer.classList.add('hidden');
        container.innerHTML = '';
        return;
    }

    emptyMsg.classList.add('hidden');
    footer.classList.remove('hidden');
    container.innerHTML = '';

    let total = 0;
    cart.forEach((item, idx) => {
        const modTotal = item.modifiers.reduce((s, m) => s + m.price_cents, 0);
        const lineTotal = (item.unit_price_cents + modTotal) * item.quantity;
        total += lineTotal;

        const modsHtml = item.modifiers.map(m => {
            const p = m.price_cents > 0 ? ` (+€${(m.price_cents/100).toFixed(2)})` : '';
            return `<span class="text-xs text-gray-500">${m.modifier_name}${p}</span>`;
        }).join(', ');

        container.innerHTML += `
            <div class="bg-white rounded-lg shadow-sm p-4 border flex justify-between items-start">
                <div class="flex-1">
                    <div class="font-medium">${item.quantity}x ${item.item_name}</div>
                    ${modsHtml ? `<div class="mt-1">${modsHtml}</div>` : ''}
                    ${item.special_notes ? `<div class="text-xs text-gray-400 mt-1">${item.special_notes}</div>` : ''}
                </div>
                <div class="flex items-center gap-3 ml-4">
                    <span class="font-medium">€${(lineTotal/100).toFixed(2)}</span>
                    <button onclick="removeItem(${idx})" class="text-red-400 hover:text-red-600 text-sm">${t('cart.remove')}</button>
                </div>
            </div>
        `;
    });

    document.getElementById('cart-total').textContent = `€${(total/100).toFixed(2)}`;
}

function removeItem(idx) {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.splice(idx, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    renderCart();
}

renderCart();
function onLangChange() { applyTranslations(); renderCart(); }
</script>
{% endblock %}
